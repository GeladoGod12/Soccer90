<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soccer90 - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #0a1f0a 0%, #0d2b0d 40%, #145214 100%);
            min-height: 100vh; display: flex; flex-direction: column; color: #fff; overflow-x: hidden;
        }
        .bg-pattern {
            position: fixed; inset: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(234, 179, 8, 0.1) 0%, transparent 40%);
            pointer-events: none; z-index: 0;
        }
        .container {
            position: relative; z-index: 1; flex: 1;
            display: flex; flex-direction: column;
            padding: 24px 20px 32px; max-width: 420px; margin: 0 auto; width: 100%;
        }
        .header { text-align: center; margin-bottom: 36px; padding-top: 20px; }
        .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 26px; box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
        }
        .logo-text { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text span { color: #fbbf24; }
        .subtitle { font-size: 14px; color: rgba(255,255,255,0.65); font-weight: 500; }
        .login-card {
            background: rgba(255,255,255,0.06); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            padding: 28px 22px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .card-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; text-align: center; }
        .card-desc { font-size: 13px; color: rgba(255,255,255,0.55); text-align: center; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.85); }
        .input-wrapper { position: relative; }
        .input-wrapper input {
            width: 100%; padding: 15px 16px 15px 48px;
            background: rgba(0,0,0,0.25); border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 14px; color: #fff; font-size: 15px; font-weight: 500; outline: none;
            transition: all 0.25s ease;
        }
        .input-wrapper input::placeholder { color: rgba(255,255,255,0.35); }
        .input-wrapper input:focus {
            border-color: #22c55e; background: rgba(0,0,0,0.35);
            box-shadow: 0 0 0 4px rgba(34,197,94,0.15);
        }
        .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: 0.6; }
        .btn-login {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(34,197,94,0.35); letter-spacing: 0.3px;
        }
        .btn-login:active { transform: scale(0.97); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        .create-account {
            text-align: center; margin-top: 28px; font-size: 14px; color: rgba(255,255,255,0.65);
        }
        .create-account a { color: #fbbf24; font-weight: 700; text-decoration: none; margin-left: 4px; }
        .footer { text-align: center; margin-top: 32px; font-size: 12px; color: rgba(255,255,255,0.35); }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header, .login-card { animation: fadeUp 0.5s ease forwards; }
        .login-card { animation-delay: 0.1s; }
        .erro {
            background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4);
            color: #fca5a5; padding: 12px; border-radius: 12px; font-size: 13px;
            text-align: center; margin-bottom: 16px; display: none;
        }
    
        .screen-toggle {
            position: fixed; top: 12px; right: 12px; z-index: 100;
            display: flex; gap: 4px; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px); border-radius: 10px; padding: 4px;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .screen-toggle button {
            padding: 7px 12px; border: none; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            background: transparent; color: rgba(255,255,255,0.5);
        }
        .screen-toggle button.on {
            background: rgba(34,197,94,0.25); color: #86efac;
        }
        body.desktop-mode .container { max-width: 640px; }
        body.desktop-mode .login-card { max-width: 480px; margin: 0 auto; }

    </style>
</head>
<body>

    <div class="screen-toggle">
        <button type="button" id="btnMobile" class="on" onclick="setScreen('mobile')">📱 Celular</button>
        <button type="button" id="btnDesktop" onclick="setScreen('desktop')">🖥️ PC</button>
    </div>

    <div class="bg-pattern"></div>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">⚽</div>
                <div class="logo-text">Soccer<span>90</span></div>
            </div>
            <p class="subtitle">Seu treino. Seu jogo. Sua evolução.</p>
        </div>

        <div class="login-card">
            <h1 class="card-title">Entrar no Soccer90</h1>
            <p class="card-desc">Digite seu nome completo para continuar</p>

            <div class="erro" id="mensagemErro">Perfil não encontrado. Verifique o nome ou crie uma conta.</div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="nome" placeholder="Digite exatamente o nome do perfil" required autocomplete="name">
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    Entrar no Soccer90
                </button>
            </form>
        </div>

        <div class="create-account">
            Ainda não tem conta?
            <a href="index.html">Criar perfil</a>
        </div>

        <div class="footer">© 2026 Soccer90 • Treine como um profissional</div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();

            const nomeDigitado = document.getElementById('nome').value.trim();
            const btn = document.getElementById('btnLogin');
            const erro = document.getElementById('mensagemErro');

            if (!nomeDigitado) {
                erro.style.display = 'block';
                erro.textContent = 'Digite seu nome completo';
                return false;
            }

            const perfis = JSON.parse(localStorage.getItem('soccer90_perfis') || '[]');
            const perfilEncontrado = perfis.find(p => p.nome.toLowerCase() === nomeDigitado.toLowerCase());

            if (!perfilEncontrado) {
                erro.style.display = 'block';
                erro.textContent = 'Perfil não encontrado. Verifique o nome ou crie uma conta.';
                return false;
            }

            btn.disabled = true;
            btn.textContent = 'Entrando...';
            erro.style.display = 'none';

            localStorage.setItem('soccer90_logado', 'true');
            localStorage.setItem('soccer90_usuario_atual', JSON.stringify(perfilEncontrado));

            setTimeout(() => {
                window.location.href = 'soccer90.html';
            }, 800);

            return false;
        }

        function setScreen(mode) {
            localStorage.setItem('soccer90_screen', mode);
            document.body.classList.toggle('desktop-mode', mode === 'desktop');
            document.getElementById('btnMobile').classList.toggle('on', mode === 'mobile');
            document.getElementById('btnDesktop').classList.toggle('on', mode === 'desktop');
        }
        (function(){
            const mode = localStorage.getItem('soccer90_screen') || 'mobile';
            setScreen(mode);
        })();

    </script>
</body>
</html>
